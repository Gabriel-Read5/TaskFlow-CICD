<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="TaskFlow - Aplicación web para gestionar tareas">

    <title>TaskFlow | Gestión de tareas</title>

    <link rel="stylesheet" href="/src/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <div>
                <span class="brand">TASKFLOW</span>
                <h1>Mis tareas</h1>
                <p>Organiza tu día, una tarea a la vez.</p>
            </div>

            <div class="header-icon">✓</div>
        </header>

        <section class="stats">

            <article class="stat-card">
                <span>Pendientes</span>
                <strong id="pending-count">0</strong>
            </article>

            <article class="stat-card">
                <span>Completadas</span>
                <strong id="completed-count">0</strong>
            </article>

            <article class="stat-card">
                <span>Total</span>
                <strong id="total-count">0</strong>
            </article>

        </section>

        <section class="task-section">

            <h2>Agregar una tarea</h2>

            <form id="task-form">

                <input
                    type="text"
                    id="task-input"
                    placeholder="¿Qué necesitas hacer?"
                    maxlength="100"
                    required
                >

                <button type="submit">+ Agregar</button>

            </form>

        </section>

        <section class="task-section">

            <h2>Mi lista</h2>

            <div id="task-list" class="task-list">

                <p class="empty-message">
                    No tienes tareas todavía.
                </p>

            </div>

        </section>

        <footer>
            <p>TaskFlow - Proyecto académico CI/CD</p>
        </footer>

    </main>

    <script type="module" src="/src/app.js"></script>

</body>
</html>
